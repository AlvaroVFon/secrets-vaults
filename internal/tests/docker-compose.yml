services:
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../../migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/${DBNAME:-test}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${DBNAME:-test}
    ports:
      - "4321:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DBNAME:-test}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_test:
